<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Same rounded-square silhouette as konh.org's mark, in VEX red. -->
  <rect width="64" height="64" rx="14" fill="#d22630"/>
  <!-- V for VEX, drawn as a stroke so it stays crisp at 16px. -->
  <path d="M16 17 L32 45 L48 17" fill="none" stroke="#fff" stroke-width="7"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- A caret sitting in the V: two people, one file. -->
  <rect x="29.5" y="24" width="5" height="13" rx="2.5" fill="#fff" opacity="0.55"/>
</svg>
